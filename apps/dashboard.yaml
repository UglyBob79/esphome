packages:
  common: !include ../common/common_eink.yaml
  hardware: !include ../hardware/esp32/waveshare-eink.yaml

esphome:
  includes:
    - apps/dashboard/eink_fetcher.h

font:
  - file: apps/dashboard/fonts/GothamRnd-Bold.ttf
    id: font_title
    size: 30
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!-:()"
  - file: apps/dashboard/fonts/GothamRnd-Book.ttf
    id: font_body
    size: 20
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 .,!-:()"

globals:
  - id: eink_page_index
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: fetch_eink_image
    then:
      - lambda: |-
          // Try the next page. If the fetch fails (short read = file missing),
          // wrap back to page 0. Page count is implicitly whatever AppDaemon
          // generated — nothing to hardcode here.
          char path[48];
          int next = id(eink_page_index) + 1;
          snprintf(path, sizeof(path), "/local/eink_page%d.bin", next);
          if (eink_fetch("${ha_host}", ${ha_port}, path)) {
            id(eink_page_index) = next;
          } else {
            eink_fetch("${ha_host}", ${ha_port}, "/local/eink_page0.bin");
            id(eink_page_index) = 0;
          }
      - component.update: eink_display

display:
  - platform: waveshare_epaper
    id: !extend eink_display
    rotation: ${display_rotation}
    lambda: |-
      if (!EINK_IMAGE_READY) {
        int cx = it.get_width() / 2;
        int cy = it.get_height() / 2;
        it.fill(COLOR_OFF);
        it.printf(cx, cy - 30, id(font_title), COLOR_ON, TextAlign::CENTER, "No dashboard image");
        it.printf(cx, cy + 20, id(font_body),  COLOR_ON, TextAlign::CENTER, "Check AppDaemon logs");
        return;
      }
      memcpy(DisplayBufAccessor::get(&it), EINK_IMAGE_BUF, 48000);
